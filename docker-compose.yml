services:
  slot:
    build: .
    image: the-descent:local
    container_name: the-descent
    ports:
      - "8080:8080"          # PC: http://localhost:8080/canvas  phone: http://<pc-ip>:8080/canvas
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    environment:
      SLOT_DEBUG_ENDPOINTS: "0"   # set to "1" only on a dev box: enables /api/snapshot and /api/upload-model (they write files)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/slot/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Public https link for testers, no router ports opened: a Cloudflare Tunnel from this stack to the slot service.
  # Quick (random *.trycloudflare.com URL, changes on every restart, no account needed):
  #     docker compose --profile tunnel up -d --build  &&  docker compose logs tunnel | grep trycloudflare
  # Stable (your own hostname): create a tunnel in the Cloudflare Zero Trust dashboard, put its token in .env as
  #     TUNNEL_TOKEN=...   and run the same command; the dashboard maps the hostname to http://slot:8080.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: the-descent-tunnel
    profiles: ["tunnel"]
    depends_on:
      slot:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: >
      sh -c 'if [ -n "$$TUNNEL_TOKEN" ]; then exec cloudflared tunnel --no-autoupdate run;
             else exec cloudflared tunnel --no-autoupdate --url http://slot:8080; fi'
