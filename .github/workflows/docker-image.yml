name: docker-image

# Build the container on every push that touches the engine, the front end or the Docker files, boot it, and check
# that the health endpoint answers and the canvas front end is served. No registry push: the image is a build check.

on:
  push:
    paths: ["Dockerfile", ".dockerignore", "docker-compose.yml", "requirements.txt", "slot_engine/**", ".github/workflows/docker-image.yml"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "docker-compose.yml", "requirements.txt", "slot_engine/**"]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t the-descent:ci .
      - name: Boot with the compose hardening and smoke-test
        run: |
          docker run -d --name slot --read-only --tmpfs /tmp:size=16m --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 512m --pids-limit 128 -p 8080:8080 the-descent:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/slot/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/slot/health | grep -q ONLINE
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/static/canvas/index.html | grep -q 200
          curl -fsS -X POST http://127.0.0.1:8080/api/slot/spin -H 'Content-Type: application/json' -d '{"bet":1.0,"feature_buy":"NONE"}' | grep -q spin_id
          # the file-writing debug endpoints must be off in the container
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/snapshot -H 'Content-Type: application/json' -d '{"image_base64":"AA=="}')" = "404"
          docker logs slot | tail -20
      - name: Image size
        run: docker image inspect the-descent:ci --format 'size {{.Size}} bytes'
