<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Dark Volcanic Basalt Slab Texture -->
    <radialGradient id="slabGrad-K" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b2308" />
      <stop offset="65%" stop-color="#1c1002" />
      <stop offset="100%" stop-color="#010408" />
    </radialGradient>

    <!-- Bioluminescent Glyph Glow -->
    <filter id="runeGlow-K" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner Stone Chiseled Shadow -->
    <filter id="chiselDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.9" />
    </filter>

    <linearGradient id="edgeGrad-K" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Volcanic Basalt Slab Base with Jagged Beveled Edges -->
  <polygon points="25,12 175,10 190,45 188,160 165,190 35,188 10,155 12,40" 
           fill="url(#slabGrad-K)" 
           stroke="url(#edgeGrad-K)" 
           stroke-width="3" 
           filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.95))" />

  <!-- Carved Stone Fissures / Stress Cracks -->
  <path d="M 28,35 L 65,70 L 55,110 L 80,145" fill="none" stroke="#000" stroke-width="2.5" opacity="0.6" />
  <path d="M 29,36 L 66,71 L 56,111 L 81,146" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.4" />
  
  <path d="M 172,30 L 140,65 L 155,105 L 135,160" fill="none" stroke="#000" stroke-width="2.5" opacity="0.6" />
  <path d="M 171,31 L 139,66 L 154,106 L 134,161" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.4" />

  <!-- Barnacles / Weathered Coral Specks -->
  <circle cx="32" cy="168" r="4" fill="#081825" stroke="#78350f" stroke-width="1" />
  <circle cx="42" cy="174" r="3" fill="#081825" stroke="#78350f" stroke-width="1" />
  <circle cx="168" cy="35" r="3.5" fill="#081825" stroke="#78350f" stroke-width="1" />

  <!-- Ancient Background Eldritch Watermark Glyph -->
  <text x="100" y="135" 
        font-family="'Cinzel', serif" 
        font-size="95" 
        font-weight="900" 
        fill="#78350f" 
        opacity="0.25" 
        text-anchor="middle">ᚲ</text>

  <!-- Glowing Primary Chiseled Rune Symbol -->
  <text x="100" y="128" 
        font-family="'Cinzel', 'Cinzel Decorative', serif" 
        font-size="64" 
        font-weight="900" 
        fill="#fbbf24" 
        stroke="#d97706"
        stroke-width="1"
        text-anchor="middle" 
        filter="url(#runeGlow-K)">
    K
  </text>

  <!-- Subtitle Tag -->
  <text x="100" y="162" 
        font-family="'Orbitron', monospace" 
        font-size="10" 
        font-weight="700" 
        letter-spacing="3" 
        fill="#fbbf24" 
        opacity="0.8" 
        text-anchor="middle">
    RUNESTONE
  </text>
</svg>